configuration:
  api_token:
    name: Локальный API-токен
    description: Оставьте пустым — надёжный токен будет создан и сохранён автоматически.
  pairing_enabled:
    name: Окно pairing
    description: Включайте только на время добавления или замены интеграции Home Assistant.
  control_enabled:
    name: Управление шлагбаумами
    description: Общий выключатель всех физических команд открытия.
  control_cooldown_seconds:
    name: Пауза между командами
    description: Минимальный интервал в секундах для одного шлагбаума.
  refresh_before_expiry_seconds:
    name: Запас обновления потока
    description: За сколько секунд до истечения обновлять временный источник камеры.
  refresh_retry_seconds:
    name: Интервал повтора
    description: Задержка перед повтором неудачного обращения к провайдеру.
  provider_username:
    name: Устаревший логин (игнорируется)
    description: Поле сохранено только для безопасного обновления старых установок.
  provider_password:
    name: Устаревший пароль (игнорируется)
    description: Поле сохранено только для безопасного обновления старых установок.
  auth_url:
    name: Устаревший URL авторизации (игнорируется)
    description: Проверенный адрес встроен в дополнение и не переопределяется.
  app:
    name: Устаревшее поле app (игнорируется)
    description: Поле сохранено только для безопасного обновления старых установок.
  client_id:
    name: Устаревший client ID (игнорируется)
    description: Поле сохранено только для безопасного обновления старых установок.
  fingerprint:
    name: Устаревший fingerprint (игнорируется)
    description: Поле сохранено только для безопасного обновления старых установок.
  provider_object_id:
    name: Устаревший номер объекта (игнорируется)
    description: Номер объекта вводится только в мастере входа интеграции.
  provider_sms_code:
    name: Устаревший SMS-код (игнорируется)
    description: SMS-код вводится только в мастере входа интеграции.
  camera_aliases:
    name: Устаревшие псевдонимы камер (игнорируются)
    description: Имена камер определяются автоматически.
network:
  8099/tcp: API моста с авторизацией (только доверенная сеть)
  8554/tcp: Стабильные локальные RTSP-потоки (только доверенная сеть)
