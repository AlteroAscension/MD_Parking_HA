name: MD Parking Bridge
version: 0.5.0
slug: md_parking_bridge
description: MD Parking cameras and explicitly controlled barrier access
url: https://github.com/AlteroAscension/MD_Parking_HA
startup: services
boot: auto
init: false
arch:
  - amd64
ports:
  8099/tcp: 8099
  8554/tcp: 8554
ports_description:
  8099/tcp: Bridge status API (keep internal to Home Assistant)
  8554/tcp: Local go2rtc RTSP stream
options:
  api_token: ""
  pairing_enabled: false
  control_enabled: false
  control_cooldown_seconds: 15
  provider_username: ""
  provider_password: ""
  auth_url: "https://auth.mdparking.ru/v2/"
  app: ""
  client_id: ""
  fingerprint: ""
  provider_object_id: ""
  provider_sms_code: ""
  refresh_before_expiry_seconds: 15
  refresh_retry_seconds: 10
  camera_aliases: []
schema:
  api_token: password
  pairing_enabled: bool
  control_enabled: bool
  control_cooldown_seconds: int(10,300)
  provider_username: str?
  provider_password: password?
  auth_url: url
  app: str?
  client_id: str?
  fingerprint: str?
  provider_object_id: password?
  provider_sms_code: password?
  refresh_before_expiry_seconds: int(5,55)
  refresh_retry_seconds: int(5,300)
  camera_aliases:
    - str
